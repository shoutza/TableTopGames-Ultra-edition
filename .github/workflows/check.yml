name: Project checks

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Start-TableTopGames.bat --help
      - name: Check Mac launcher
        if: runner.os != 'Windows'
        shell: bash
        run: bash Start-TableTopGames.command --help
